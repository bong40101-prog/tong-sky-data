name: Blog sidebar layout check
on:
  push:
    branches: [web-source]
    paths: ['dist/blog*', 'dist/index.html', 'tests/blog-ui.cjs', 'tests/blog-refresh.test.cjs', '.github/workflows/blog-ui.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: npm install --prefix "$RUNNER_TEMP/blog-browser" --no-save --ignore-scripts playwright@1.64.1 jsdom@26.1.0
      - run: '"$RUNNER_TEMP/blog-browser/node_modules/.bin/playwright" install --with-deps chromium'
      - run: node --test tests/blog-refresh.test.cjs
        env:
          JSDOM_MODULE: ${{ runner.temp }}/blog-browser/node_modules/jsdom
      - run: node tests/blog-ui.cjs
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/blog-browser/node_modules/playwright
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: blog-layout-evidence
          path: test-evidence/
          retention-days: 7
