name: Refresh developer blog posts
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/update-blog-feed.py', '.github/workflows/blog-feed.yml']
permissions:
  contents: read
concurrency:
  group: developer-blog-feed
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
          path: source
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: gh-pages
          path: website
      - name: Refresh public RSS index
        run: python3 source/scripts/update-blog-feed.py --output website/blog-feed.json
      - name: Commit only the blog post index
        id: commit
        working-directory: website
        run: |
          git add -- blog-feed.json
          if git diff --cached --quiet; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Update developer blog post index'
          git pull --rebase origin gh-pages
          git push origin HEAD:gh-pages
          echo 'changed=true' >> "$GITHUB_OUTPUT"
