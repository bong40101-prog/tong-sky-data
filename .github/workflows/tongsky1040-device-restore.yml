name: TongSKY 1040 signed APK upgrade and launch
on:
  push:
    branches: [recovery/tongsky-1040]
    paths: ['.github/workflows/tongsky1040-device-restore.yml']
permissions:
  contents: read
jobs:
  device:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: bong40101-prog/tong-series
          ref: afe361dcd7e67972fb2690bef5c85944859e4488
          persist-credentials: false
      - name: Prepare device test
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
          cat > "$RUNNER_TEMP/tong-device.sh" <<'SH'
          set -euxo pipefail
          adb shell svc wifi disable
          adb shell svc data disable
          adb install TongSKY-1.0.39.apk
          uid(){ adb shell pm list packages -U kr.tong.sky | tr -d '\r'; }
          prev=$(uid); adb install -r TongSKY-1.0.40.apk; test -n "$prev"; test "$prev" = "$(uid)"
          adb shell dumpsys package kr.tong.sky > pkg.txt
          grep -F versionCode=10140 pkg.txt
          adb shell cmd package query-activities --brief --query-flags 32 --user 0 -a android.intent.action.MAIN -c android.intent.category.LAUNCHER -p kr.tong.sky | tee launcher.txt
          grep -F 'kr.tong.sky/' launcher.txt
          adb logcat -c
          adb shell wm dismiss-keyguard
          adb shell am start -W --user 0 -a android.intent.action.MAIN -c android.intent.category.LAUNCHER -n kr.tong.sky/.MainActivity | tee launch.txt
          grep 'Status: ok' launch.txt
          sleep 12
          adb logcat -d -b crash > crashes.txt
          if grep -Eq 'Process: kr\.tong\.sky([:, ]|$)' crashes.txt; then cat crashes.txt; exit 1; fi
          adb shell pidof kr.tong.sky
          adb shell dumpsys activity activities > acts.txt
          grep -Ei '(resumedactivity|topresumed|resumed:).*kr\.tong\.sky' acts.txt
          SH
      - uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          cores: 2
          ram-size: 3072M
          disable-animations: true
          emulator-boot-timeout: 300
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: bash "$RUNNER_TEMP/tong-device.sh"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: signed-apk-device-trace
          path: |
            pkg.txt
            launcher.txt
            launch.txt
            crashes.txt
            acts.txt
          if-no-files-found: warn
          retention-days: 5
